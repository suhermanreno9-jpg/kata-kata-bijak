<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kata Kata Bijak</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b111b;--panel:#161f2e;--panel2:#1c2739;--line:#27344a;--text:#eef2f8;--mute:#8b9ab0;--accent:#3b82f6;--ok:#4ade80;--err:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;line-height:1.5;background:radial-gradient(900px 420px at 15% -10%,#14305c55,transparent 70%),radial-gradient(700px 380px at 100% 0,#1d3a6b33,transparent 70%),var(--bg);background-attachment:fixed}
button,input{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:auto;padding:34px 20px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,5vw,42px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.sub{margin:8px 0 0;color:var(--mute);font-size:15px}
.admin{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 15px;font-weight:600;transition:background .15s}
.admin:hover{background:var(--panel2)}
.status{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex:none}
.status.on .dot{background:var(--ok);box-shadow:0 0 0 0 #4ade8088;animation:pulse 2.4s infinite}
.status.err .dot{background:var(--err)}
@keyframes pulse{70%{box-shadow:0 0 0 7px #4ade8000}100%{box-shadow:0 0 0 0 #4ade8000}}
.sticky{position:sticky;top:0;z-index:5;margin:14px -20px 0;padding:12px 20px;background:linear-gradient(var(--bg) 70%,#0b111b00)}
.search{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.search::placeholder{color:#5d6b82}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.filter{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.filter:hover{color:var(--text);border-color:#3a4a66}
.filter.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--text);cursor:pointer;min-height:140px;padding:16px 16px 14px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.card:hover{background:var(--panel2);transform:translateY(-3px);box-shadow:0 12px 28px -14px #000}
.card:active{transform:scale(.985)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.hint{font-size:12px;font-weight:600;color:var(--mute);transition:color .15s}
.card:hover .hint{color:var(--text)}
.name{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.preview{color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.copied{background:#10301f;border-color:#1f7a45;border-top-color:var(--ok);animation:pop .3s}
.card.copied .hint{color:var(--ok)}
@keyframes pop{40%{transform:scale(1.02)}}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 20px;border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,18px);background:#0b1019;border:1px solid #1f7a45;color:var(--ok);padding:11px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.pop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,9,16,.78);backdrop-filter:blur(4px)}
.pop.show{display:flex;animation:fade .25s}
.pop-box{position:relative;max-width:min(92vw,560px);max-height:88vh;line-height:0;border-radius:16px;box-shadow:0 30px 80px -20px #000;animation:rise .3s}
.pop-box img,.pop-box video{display:block;width:auto;height:min(72vh,480px);max-width:88vw;object-fit:contain;border-radius:16px;border:1px solid var(--line);background:#000}
.pop-x{position:absolute;top:-14px;right:-14px;width:36px;height:36px;padding:0;border-radius:50%;border:2px solid var(--bg);background:#fff;color:#0b111b;font-size:22px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -4px #000;transition:transform .15s,background .15s}
.pop-x:hover{background:#e2e8f0;transform:scale(1.08)}
@media(max-width:480px){.pop-x{top:-10px;right:-6px}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="wrap">
  <header>
    <div><h1>Kata Kata Bijak</h1><p class="sub">Klik kartu untuk langsung menyalin kalimatnya.</p></div>
    <a class="admin" href="admin.html">Kelola tombol</a>
  </header>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Menghubungkan database...</span></div>
  <div class="sticky">
    <input class="search" id="search" type="search" placeholder="Cari template..." autocomplete="off">
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="buttons"></div>
</div>
<div id="pop" class="pop" role="dialog" aria-modal="true" aria-label="Pengumuman">
  <div class="pop-box"><button class="pop-x" id="popX" aria-label="Tutup">&times;</button><span id="popMedia"></span></div>
</div>
<div id="toast" class="toast" role="status">Tersalin</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kucvfhdnzaogwdmqdqge.supabase.co';
const SUPABASE_KEY='sb_publishable_xYwB-L15uxO_b75fTNyJNw_VO17PoRs';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let allButtons=[],activeCategory='Semua',subscribed=false;
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function hue(s){let h=0;for(const ch of String(s||'Umum'))h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 70% 62%)`}
function setStatus(t,cls){$('status').className='status '+(cls||'');$('statusText').textContent=t}

async function load(){
  const {data,error}=await db.from('buttons').select('*').order('sort_order').order('title');
  if(error){setStatus('Database belum siap: '+error.message,'err');render();return}
  allButtons=data||[];setStatus('Tersambung ke database online','on');render();
  if(!subscribed){subscribed=true;db.channel('buttons-live').on('postgres_changes',{event:'*',schema:'public',table:'buttons'},()=>load()).subscribe()}
}
function render(){
  const cats=['Semua',...new Set(allButtons.map(x=>x.category||'Umum'))];
  if(!cats.includes(activeCategory))activeCategory='Semua';
  $('filters').innerHTML=cats.map(c=>`<button class="filter ${c===activeCategory?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const q=$('search').value.trim().toLowerCase();
  const list=allButtons.filter(b=>(activeCategory==='Semua'||(b.category||'Umum')===activeCategory)&&(!q||(b.title+' '+b.message).toLowerCase().includes(q)));
  $('buttons').innerHTML=list.length?list.map(b=>`<button class="card" style="--c:${hue(b.category)}" data-id="${b.id}"><div class="row"><span class="cat">${esc(b.category||'Umum')}</span><span class="hint">Klik untuk salin</span></div><span class="name">${esc(b.title)}</span><span class="preview">${esc(b.message)}</span></button>`).join(''):`<div class="empty">${allButtons.length?'Tidak ada template yang cocok.':'Belum ada tombol. Tambahkan lewat halaman Kelola tombol.'}</div>`;
}
$('filters').addEventListener('click',e=>{const f=e.target.closest('[data-cat]');if(f){activeCategory=f.dataset.cat;render()}});
$('search').addEventListener('input',render);
$('buttons').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)copyText(c)});

let tm;
async function copyText(card){
  const b=allButtons.find(x=>String(x.id)===card.dataset.id);if(!b)return;
  try{await navigator.clipboard.writeText(b.message)}catch(e){const a=document.createElement('textarea');a.value=b.message;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  document.querySelectorAll('.card.copied').forEach(x=>{x.classList.remove('copied');x.querySelector('.hint').textContent='Klik untuk salin'});
  card.classList.add('copied');card.querySelector('.hint').textContent='Tersalin';
  const t=$('toast');t.textContent='Tersalin: '+b.title;t.classList.add('show');
  clearTimeout(tm);tm=setTimeout(()=>{t.classList.remove('show');card.classList.remove('copied');card.querySelector('.hint').textContent='Klik untuk salin'},1400);
}
/* Pop up muncul sekali per kunjungan (tidak muncul lagi saat kembali dari halaman admin). Isi POPUP_MEDIA dengan file di repo (popup.mp4, popup.gif) atau link. Kosongkan '' untuk menonaktifkan. */
const POPUP_MEDIA='popup.mp4';
(function(){
  if(!POPUP_MEDIA)return;
  const KEY='popupSeen';
  try{if(sessionStorage.getItem(KEY))return}catch(e){}
  const pop=$('pop');
  const isVideo=/\.(mp4|webm)(\?.*)?$/i.test(POPUP_MEDIA);
  function close(){pop.classList.remove('show');document.body.style.overflow='';const v=pop.querySelector('video');if(v)v.pause()}
  function open(el){try{sessionStorage.setItem(KEY,'1')}catch(e){}$('popMedia').replaceWith(el);pop.classList.add('show');document.body.style.overflow='hidden';$('popX').focus()}
  if(isVideo){
    const v=document.createElement('video');
    v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('aria-hidden','true');
    v.addEventListener('loadeddata',()=>{open(v);v.play().catch(()=>{})},{once:true});
    v.src=POPUP_MEDIA;
  }else{
    const i=new Image();i.alt='';i.onload=()=>open(i);i.src=POPUP_MEDIA;
  }
  $('popX').addEventListener('click',close);
  pop.addEventListener('click',e=>{if(e.target===pop)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
load();
</script></body></html>
