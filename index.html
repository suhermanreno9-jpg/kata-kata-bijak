<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template WD Online</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:35px 20px;font-family:Arial,Helvetica,sans-serif;background:#111827;color:#fff}.container{max-width:900px;margin:auto}h1{margin:0 0 7px;font-size:28px}.desc{color:#9ca3af;margin-bottom:25px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap}.status{font-size:12px;color:#9ca3af}.admin-link{color:#93c5fd;text-decoration:none}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid #374151;background:#1f2937;color:#ddd;border-radius:999px;padding:8px 13px;cursor:pointer}.filter.active{border-color:#60a5fa;color:#fff;background:#26364d}.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.copy-btn{border:1px solid #374151;border-radius:12px;background:#1f2937;color:white;padding:20px 18px;min-height:105px;cursor:pointer;text-align:left;transition:.15s ease}.copy-btn:hover{background:#273449;border-color:#60a5fa;transform:translateY(-2px)}.copy-btn:active{transform:scale(.98)}.copy-btn span{display:block;font-size:17px;font-weight:700}.copy-btn small{display:block;margin-top:9px;color:#9ca3af;font-size:10px;letter-spacing:1px}.copy-btn.copied{background:#153522;border-color:#22c55e}.empty{text-align:center;color:#9ca3af;padding:40px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#22c55e;color:white;padding:11px 18px;border-radius:999px;font-weight:bold;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="container">
  <div class="top"><div><h1>Template WD Online</h1><div class="desc">Klik tombol untuk langsung menyalin kalimatnya.</div></div><a class="admin-link" href="admin.html">⚙ Kelola Tombol</a></div>
  <div class="status" id="status">Menghubungkan database...</div>
  <div class="filters" id="filters"></div>
  <div class="buttons" id="buttons"></div>
</div>
<div id="toast" class="toast">✓ Kalimat berhasil di-copy!</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'ISI_SUPABASE_URL';
const SUPABASE_KEY = 'ISI_SUPABASE_PUBLISHABLE_KEY';
const configured = !SUPABASE_URL.startsWith('ISI_') && !SUPABASE_KEY.startsWith('ISI_');
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let allButtons=[], activeCategory='Semua';
const fallback=[
['WD GANG','Mohon maaf atas keterlambatan proses withdrawal saat ini. Saat ini sistem pemrosesan WD sedang mengalami kendala teknis, sehingga beberapa transaksi membutuhkan waktu lebih lama dari biasanya ya bosku.','WD'],
['MINTA AMPUN 1','Mohon maaf sebesar-besarnya atas ketidaknyamanan dan keterlambatan proses WD saat ini, bosku 🙏','WD'],
['MINTA AMPUN 2','Sekali lagi kami mohon maaf atas keterlambatan ini, bosku 🙏 Kami akan terus memantau perkembangan sistem dan memberikan informasi apabila sudah ada update terbaru. Terima kasih banyak atas pengertian dan kesabarannya, bosku.','WD'],
['TIDAK BISA BATAL','Mohon maaf ya bosku 🙏 Untuk saat ini proses WD yang sudah diajukan belum dapat dibatalkan terlebih dahulu, karena transaksi masih dalam proses sistem.','WD'],
['SECEPATNYA','Kami pasti akan usahakan prosesnya secepatnya ya bosku 🙏 Saat ini tim terkait masih melakukan pengecekan dan perbaikan pada sistem WD.','WD'],
['ESTIMASI','Untuk saat ini kami juga belum mendapatkan informasi pasti mengenai estimasi waktu sistem akan kembali normal. Tim terkait masih melakukan pengecekan dan perbaikan agar proses dapat segera kembali berjalan seperti biasa ya bosku.','WD']].map((x,i)=>({id:i,title:x[0],message:x[1],category:x[2],sort_order:i+1}));
async function load(){
 if(!db){allButtons=fallback;document.getElementById('status').textContent='Mode demo — isi konfigurasi Supabase untuk memakai database online.';render();return}
 const {data,error}=await db.from('buttons').select('*').order('sort_order').order('title');
 if(error){allButtons=fallback;document.getElementById('status').textContent='Database belum siap: '+error.message;render();return}
 allButtons=data||[];document.getElementById('status').textContent='✓ Tersambung ke database online';render();
 db.channel('buttons-live').on('postgres_changes',{event:'*',schema:'public',table:'buttons'},()=>load()).subscribe();
}
function render(){
 const cats=['Semua',...new Set(allButtons.map(x=>x.category||'Umum'))];
 document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter ${c===activeCategory?'active':''}" onclick="setCategory(${JSON.stringify(c)})">${escapeHtml(c)}</button>`).join('');
 const list=activeCategory==='Semua'?allButtons:allButtons.filter(x=>(x.category||'Umum')===activeCategory);
 document.getElementById('buttons').innerHTML=list.length?list.map(b=>`<button class="copy-btn" data-text="${escapeAttr(b.message)}" onclick="copyText(this)"><span>${escapeHtml(b.title)}</span><small>${escapeHtml(b.category||'Umum')} • CLICK TO COPY</small></button>`).join(''):'<div class="empty">Belum ada tombol.</div>';
}
function setCategory(c){activeCategory=c;render()}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
async function copyText(button){const text=button.dataset.text;try{await navigator.clipboard.writeText(text)}catch(e){const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}document.querySelectorAll('.copy-btn').forEach(b=>b.classList.remove('copied'));button.classList.add('copied');const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');button.classList.remove('copied')},900)}
load();
</script>
</body>
</html>
