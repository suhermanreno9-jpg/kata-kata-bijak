<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Template WD</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 20px;background:#111827;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto}h1{margin:0 0 8px}.muted{color:#9ca3af}.panel{background:#1f2937;border:1px solid #374151;border-radius:14px;padding:20px;margin-top:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}label{display:block;margin:0 0 7px;font-size:13px;color:#d1d5db}input,textarea,select{width:100%;background:#111827;color:#fff;border:1px solid #374151;border-radius:9px;padding:11px;font:inherit}textarea{min-height:130px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700;text-decoration:none}button.primary{background:#2563eb;color:#fff}button.secondary{background:#374151;color:#fff}button.danger{background:#7f1d1d;color:#fff}.hidden{display:none}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #374151}.item:last-child{border-bottom:0}.title{font-weight:700}.message{font-size:13px;color:#9ca3af;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:11px;color:#93c5fd}.login{max-width:430px;margin:60px auto}.error{color:#fca5a5;margin-top:10px}.ok{color:#86efac;margin-top:10px}</style></head>
<body><div class="wrap">
<div id="login" class="login panel"><h1>Login Admin</h1><p class="muted">Gunakan akun Supabase yang sudah didaftarkan sebagai admin.</p><input id="email" type="email" placeholder="Email"><br><br><input id="password" type="password" placeholder="Password"><div class="actions"><button class="primary" onclick="login()">Login</button></div><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h1>Kelola Template WD</h1><div class="muted">Perubahan langsung tersimpan ke database online.</div></div><div class="actions"><a href="index.html" class="secondary">← Halaman Utama</a><button class="secondary" onclick="logout()">Logout</button></div></div>
<div class="panel"><h2 id="formTitle">Tambah Tombol</h2><div class="row"><div><label>Nama / Judul Tombol</label><input id="title" placeholder="Contoh: WD LAMA"></div><div><label>Kategori</label><input id="category" value="WD" placeholder="WD / Deposit / Bonus"></div></div><br><label>Isi Kalimat</label><textarea id="message" placeholder="Kalimat yang akan di-copy..."></textarea><div class="actions"><button class="primary" onclick="saveButton()" id="saveBtn">+ Simpan Tombol</button><button class="secondary" onclick="resetForm()">Bersihkan</button></div><div id="formMsg"></div></div>
<div class="panel"><h2>Daftar Tombol</h2><div id="list">Memuat...</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://kucvfhdnzaogwdmqdqge.supabase.co';const SUPABASE_KEY='sb_publishable_xYwB-L15uxO_b75fTNyJNw_VO17PoRs';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let editingId=null;
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await db.auth.signInWithPassword({email,password});document.getElementById('loginMsg').innerHTML=error?`<div class="error">${esc(error.message)}</div>`:'';if(!error)check()}
async function check(){const {data:{session}}=await db.auth.getSession();if(!session){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return}const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await db.auth.signOut();document.getElementById('loginMsg').innerHTML='<div class="error">Akun belum terdaftar sebagai admin.</div>';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadList()}
async function logout(){await db.auth.signOut();location.reload()}
async function loadList(){const {data,error}=await db.from('buttons').select('*').order('sort_order').order('title');document.getElementById('list').innerHTML=error?`<div class="error">${esc(error.message)}</div>`:(data||[]).map(b=>`<div class="item"><div><div class="title">${esc(b.title)} <span class="pill">${esc(b.category||'Umum')}</span></div><div class="message">${esc(b.message)}</div></div><div class="actions"><button class="secondary" onclick='editButton(${JSON.stringify(b)})'>Edit</button><button class="danger" onclick="deleteButton(${b.id})">Hapus</button></div></div>`).join('')||'<div class="muted">Belum ada tombol.</div>'}
function editButton(b){editingId=b.id;title.value=b.title;category.value=b.category||'Umum';message.value=b.message;formTitle.textContent='Edit Tombol';saveBtn.textContent='Simpan Perubahan';scrollTo({top:0,behavior:'smooth'})}
function resetForm(){editingId=null;title.value='';category.value='WD';message.value='';formTitle.textContent='Tambah Tombol';saveBtn.textContent='+ Simpan Tombol';formMsg.innerHTML=''}
async function saveButton(){const t=title.value.trim(),m=message.value.trim(),c=category.value.trim()||'Umum';if(!t||!m){formMsg.innerHTML='<div class="error">Nama dan kalimat wajib diisi.</div>';return}let result;if(editingId)result=await db.from('buttons').update({title:t,message:m,category:c,updated_at:new Date().toISOString()}).eq('id',editingId);else{const {data:last}=await db.from('buttons').select('sort_order').order('sort_order',{ascending:false}).limit(1);const next=(last?.[0]?.sort_order||0)+1;result=await db.from('buttons').insert({title:t,message:m,category:c,sort_order:next})}if(result.error){formMsg.innerHTML=`<div class="error">${esc(result.error.message)}</div>`;return}formMsg.innerHTML='<div class="ok">✓ Tersimpan ke database online.</div>';resetForm();loadList()}
async function deleteButton(id){if(!confirm('Hapus tombol ini?'))return;const {error}=await db.from('buttons').delete().eq('id',id);if(error)alert(error.message);else loadList()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
check();
</script></body></html>
